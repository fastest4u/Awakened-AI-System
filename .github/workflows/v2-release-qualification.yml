          const fail = code => { throw new Error(code); };
          const git = (...args) => {
            try { return execFileSync("git", args, { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] }).trim(); }
            catch { fail("V2_CI_GIT_FAILED"); }
          };
